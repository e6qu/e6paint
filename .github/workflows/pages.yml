name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk and the wasm-bindgen CLI (the raster worker)
        run: |
          cargo install --locked trunk
          cargo install --locked wasm-bindgen-cli --version 0.2.129
      - name: Build web app
        # Project pages serve under /e6paint/: the public URL must match so the
        # hashed asset references resolve.
        run: trunk build --release --public-url /e6paint/
        working-directory: crates/app
      - name: Deploy (the canvas is the page)
        uses: actions/upload-pages-artifact@v5
        with:
          path: crates/app/dist
      - id: deployment
        uses: actions/deploy-pages@v5
