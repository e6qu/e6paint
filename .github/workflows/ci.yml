name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Clippy for the wasm target (wasm-only cfg code is invisible to host clippy)
        run: cargo clippy -p e6-app --target wasm32-unknown-unknown -- -D warnings
      - name: Install trunk
        run: cargo install --locked trunk
      - name: Build web app
        run: trunk build --release
        working-directory: crates/app
      - name: Enforce wasm size budget (5 MB gz, DESIGN §10)
        run: |
          wasm=$(ls crates/app/dist/*_bg.wasm)
          gz=$(gzip -9 -c "$wasm" | wc -c)
          echo "wasm: $(wc -c < "$wasm") bytes raw, $gz bytes gzipped"
          limit=$((5 * 1024 * 1024))
          if [ "$gz" -gt "$limit" ]; then
            echo "::error::wasm is $gz bytes gzipped; budget is $limit"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: e6paint-web
          path: crates/app/dist

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
